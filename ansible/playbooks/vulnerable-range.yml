---
# Builds out the vulnerable CyberHawks AD range per
# ansible/VULNERABLE_RANGE_PLAN.md. Each phase is its own role, tagged so it
# can be re-run individually, e.g.:
#   ansible-playbook playbooks/vulnerable-range.yml --tags base_accounts

- name: Network prerequisites - enable SMB/File-and-Printer-Sharing (not a named finding, required plumbing)
  hosts: windows_vms
  gather_facts: false
  tags: [network_prereqs]
  roles:
    - network_prereqs

- name: Phase B - Foundational AD objects (starter accounts, pool, computers, DNS)
  hosts: dc1
  gather_facts: false
  tags: [base_accounts]
  roles:
    - ad_base_accounts

- name: Phase C - LAPS schema extension + self-permission
  hosts: dc2
  gather_facts: false
  tags: [laps]
  tasks:
    - ansible.builtin.import_role:
        name: laps
        tasks_from: schema_and_permissions

- name: Phase C - LAPS enable on ca and sql2
  hosts: ca,sql2
  gather_facts: false
  tags: [laps]
  tasks:
    - ansible.builtin.import_role:
        name: laps
        tasks_from: enable_on_targets

- name: Phase C - LAPS verification
  hosts: dc2
  gather_facts: false
  tags: [laps]
  tasks:
    - ansible.builtin.import_role:
        name: laps
        tasks_from: verify

- name: Phase D - ACL grants (nine rights)
  hosts: dc1
  gather_facts: false
  tags: [acls]
  tasks:
    - ansible.builtin.import_role:
        name: ad_acls
        tasks_from: grant_main

- name: Phase D - ACL grant (LAPS read, needs LAPS module)
  hosts: dc2
  gather_facts: false
  tags: [acls]
  tasks:
    - ansible.builtin.import_role:
        name: ad_acls
        tasks_from: grant_laps_read

- name: Phase E - Delegation (admin account, web Unconstrained Delegation)
  hosts: dc1
  gather_facts: false
  tags: [delegation]
  roles:
    - ad_delegation

- name: Phase E - Delegation (constrained, sql1$/sql2$)
  hosts: dc1
  gather_facts: false
  tags: [delegation]
  tasks:
    - ansible.builtin.import_role:
        name: ad_delegation
        tasks_from: constrained_delegation

- name: Phase E - Print Spooler on domain controllers
  hosts: dc1,dc2
  gather_facts: false
  tags: [delegation]
  tasks:
    - ansible.builtin.import_role:
        name: ad_delegation
        tasks_from: print_spooler

- name: Phase E - Admin autologon on web
  hosts: web
  gather_facts: false
  tags: [delegation]
  tasks:
    - ansible.builtin.import_role:
        name: ad_delegation
        tasks_from: web_autologon

- name: Phase E - user1 local admin on web
  hosts: web
  gather_facts: false
  tags: [delegation]
  tasks:
    - ansible.builtin.import_role:
        name: ad_delegation
        tasks_from: user1_local_admin_web

- name: Phase F - MSSQL AD accounts (svc-mssql, crackme)
  hosts: dc1
  gather_facts: false
  tags: [mssql]
  tasks:
    - ansible.builtin.import_role:
        name: mssql_misconfig
        tasks_from: ad_accounts

- name: Phase F - MSSQL misconfiguration on sql2 (link target)
  hosts: sql2
  gather_facts: false
  tags: [mssql]
  tasks:
    - ansible.builtin.import_role:
        name: mssql_misconfig
        tasks_from: sql2

- name: Phase F - MSSQL misconfiguration on sql1
  hosts: sql1
  gather_facts: false
  tags: [mssql]
  tasks:
    - ansible.builtin.import_role:
        name: mssql_misconfig
        tasks_from: sql1

- name: Phase G - CyberHawksPortal database on sql1
  hosts: sql1
  gather_facts: false
  tags: [website]
  tasks:
    - ansible.builtin.import_role:
        name: web_portal
        tasks_from: db_setup

- name: Phase G - CyberHawks Employee Portal website on web
  hosts: web
  gather_facts: false
  tags: [website]
  tasks:
    - ansible.builtin.import_role:
        name: web_portal
        tasks_from: site_setup

- name: Phase H - Build ESC templates (ESC1,2,3,4,9,13,15,17)
  hosts: dc1
  gather_facts: false
  tags: [adcs]
  tasks:
    - ansible.builtin.import_role:
        name: adcs_esc_templates
        tasks_from: create_templates

- name: Phase H - Publish ESC templates to the CA
  hosts: ca
  gather_facts: false
  tags: [adcs]
  tasks:
    - ansible.builtin.import_role:
        name: adcs_esc_templates
        tasks_from: publish_templates

- name: Phase H - Early CA config (ESC5, ESC7, ESC8 confirm, ESC11)
  hosts: ca
  gather_facts: false
  tags: [adcs]
  tasks:
    - ansible.builtin.import_role:
        name: adcs_esc_templates
        tasks_from: ca_config_early

- name: Phase H - DC config (ESC9 DC-half, ESC10)
  hosts: dc1,dc2
  gather_facts: false
  tags: [adcs]
  tasks:
    - ansible.builtin.import_role:
        name: adcs_esc_templates
        tasks_from: dc_config

# ca_config_late (ESC6, ESC16) is intentionally a SEPARATE, later tagged
# play (--tags adcs_late) run only after ESC1/ESC9/ESC10 are independently
# verified -- see ansible/VULNERABLE_RANGE_PLAN.md.
- name: Phase H - Late CA config (ESC6, ESC16) - run separately after verification
  hosts: ca
  gather_facts: false
  tags: [adcs_late]
  tasks:
    - ansible.builtin.import_role:
        name: adcs_esc_templates
        tasks_from: ca_config_late

- name: Phase I - SMB file dump on sql1
  hosts: sql1
  gather_facts: false
  tags: [smb_dump]
  roles:
    - smb_file_dump

- name: Phase J - Misc findings on dc1 (NETLOGON, anonymous logon, computer4/5, svc-backup, GPP)
  hosts: dc1
  gather_facts: false
  tags: [misc_findings]
  tasks:
    - ansible.builtin.import_role:
        name: ad_misc_findings
        tasks_from: dc1_findings

- name: Phase J - NetNTLMv1 on domain controllers
  hosts: dc1,dc2
  gather_facts: false
  tags: [misc_findings]
  tasks:
    - ansible.builtin.import_role:
        name: ad_misc_findings
        tasks_from: netntlmv1

- name: Phase J - LSA secret scheduled task on web
  hosts: web
  gather_facts: false
  tags: [misc_findings]
  tasks:
    - ansible.builtin.import_role:
        name: ad_misc_findings
        tasks_from: web_lsa_secret

- name: Phase K - Workstation coercion setup (best-effort, see plan)
  hosts: workstation
  gather_facts: false
  tags: [workstation_coercion]
  roles:
    - workstation_coercion
