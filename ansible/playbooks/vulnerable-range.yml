---
# Builds out the vulnerable CyberHawks AD range per
# ansible/VULNERABLE_RANGE_PLAN.md. Each phase is its own role, tagged so it
# can be re-run individually, e.g.:
#   ansible-playbook playbooks/vulnerable-range.yml --tags base_accounts

- name: Phase B - Foundational AD objects (starter accounts, pool, computers, DNS)
  hosts: dc1
  gather_facts: false
  tags: [base_accounts]
  roles:
    - ad_base_accounts

- name: Phase C - LAPS schema extension + self-permission
  hosts: dc2
  gather_facts: false
  tags: [laps]
  tasks:
    - ansible.builtin.import_role:
        name: laps
        tasks_from: schema_and_permissions

- name: Phase C - LAPS enable on ca and sql2
  hosts: ca,sql2
  gather_facts: false
  tags: [laps]
  tasks:
    - ansible.builtin.import_role:
        name: laps
        tasks_from: enable_on_targets

- name: Phase C - LAPS verification
  hosts: dc2
  gather_facts: false
  tags: [laps]
  tasks:
    - ansible.builtin.import_role:
        name: laps
        tasks_from: verify

- name: Phase D - ACL grants (nine rights)
  hosts: dc1
  gather_facts: false
  tags: [acls]
  tasks:
    - ansible.builtin.import_role:
        name: ad_acls
        tasks_from: grant_main

- name: Phase D - ACL grant (LAPS read, needs LAPS module)
  hosts: dc2
  gather_facts: false
  tags: [acls]
  tasks:
    - ansible.builtin.import_role:
        name: ad_acls
        tasks_from: grant_laps_read
