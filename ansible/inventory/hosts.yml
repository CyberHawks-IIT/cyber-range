all:
  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_cyberrange
  children:
    proxmox:
      hosts:
        proxmox-host:
          ansible_host: 192.168.192.150
          ansible_user: root

    linux_vms:
      hosts: {}
      # Standalone security-tooling hosts on 192.168.0.0/24 are intentionally
      # not listed here — separately managed, outside this repo's scope.

    windows_vms:
      vars:
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_port: 5985
        ansible_user: Administrator
        # Shared local Administrator / domain Administrator / sql sa password.
        # Retrieve with `qm cloudinit dump <vmid> user` on the Proxmox host,
        # then store it in group_vars/windows_vms/vault.yml (ansible-vault
        # encrypted — copy vault.yml.example and encrypt it, don't commit
        # plaintext) as vault_windows_admin_password.
        ansible_password: "{{ vault_windows_admin_password }}"
      children:
        domain_controllers:
          hosts:
            dc1:
              ansible_host: 10.0.2.2
            dc2:
              ansible_host: 10.0.2.3
        certificate_authority:
          hosts:
            ca:
              ansible_host: 10.0.2.4
              # LAPS-managed (Phase C) -- the local Administrator password
              # now rotates independently, so automation must use the
              # domain account instead (unaffected by LAPS, same password).
              ansible_user: "CYBERHAWKS\\Administrator"
        web_servers:
          hosts:
            web:
              ansible_host: 10.0.2.5
        sql_servers:
          hosts:
            sql1:
              ansible_host: 10.0.2.6
            sql2:
              ansible_host: 10.0.2.7
              # LAPS-managed (Phase C) -- see the same note under ca above.
              ansible_user: "CYBERHAWKS\\Administrator"
        workstations:
          hosts:
            workstation:
              ansible_host: 10.0.2.8
