---
# Which of the two supported setups you are building. See the two setup guides
# linked from the README:
#
#   range_monitoring: false  (default)  -> "vulnerable hosts only" (option 1).
#       vulnerable-range.yml builds just the range; no host-side detection
#       logging is turned on.
#
#   range_monitoring: true              -> "vulnerable hosts + defense VMs and
#       tooling" (option 2). vulnerable-range.yml additionally imports
#       detection-logging.yml (Phase Q), turning on the audit policy, SACLs,
#       Sysmon, 1644 diagnostics, RPC Firewall and SQL/CA/IIS telemetry that
#       the Splunk detections consume. You then deploy the defense-tooling
#       stack and splunk-detections separately (see the option-2 guide).
#
# Override per-run without editing this file: -e range_monitoring=true
range_monitoring: false

# Which web portal `web` serves. Independent of range_monitoring.
#
#   range_full_portal: false (default) -> the lightweight ASP.NET Web Forms
#       "CyberHawks Employee Portal" placeholder (Default.aspx) built in by the
#       core range's Phase G.
#
#   range_full_portal: true            -> the full ASP.NET Core 8 MVC portal
#       from the web-app repo (https://github.com/CyberHawks-IIT/web-app).
#       vulnerable-range.yml skips the placeholder Phase G and imports
#       web-portal-full.yml instead: it builds the site from source on the
#       control node (needs the .NET 8 SDK + git there), deploys it to `web`
#       under IIS via the ASP.NET Core Hosting Bundle, and points it at sql1.
#       Same externally observable findings as the placeholder, plus the
#       app-layer web vulns in the web-app repo's SITE_PLAN.md.
#
# Override per-run without editing this file: -e range_full_portal=true
range_full_portal: false
