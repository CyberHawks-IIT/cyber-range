---
# Sets each host's computer name to its inventory hostname. Cloud-init on
# this project's templates does NOT reliably rename guests off the Windows
# autogenerated WIN-XXXXXXX default (see CLAUDE.md's "Domain build" note), so
# this has to happen before promotion/join -- a DC or domain member keeps
# whatever name it had at join time.
#
# Idempotent: the rename (and its reboot) only run when the live name differs
# from the inventory name. Must run BEFORE domain_join -- Windows requires a
# rename and a reboot before the name is committed.

- name: Get current computer name
  ansible.windows.win_shell: "$env:COMPUTERNAME"
  register: current_hostname
  changed_when: false

- name: Rename computer to its inventory hostname
  ansible.windows.win_hostname:
    name: "{{ inventory_hostname }}"
  register: hostname_result
  when: current_hostname.stdout | trim | lower != inventory_hostname | lower

- name: Reboot to apply the new computer name
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: hostname_result.reboot_required | default(false)
