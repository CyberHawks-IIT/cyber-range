---
# Runs against dc1 -- the nine ACL grants that don't need the LAPS module.
- name: Upload pool credential CSV to dc1 (temp, for role lookups)
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/../generated/pool_accounts.csv"
    dest: "C:\\Windows\\Temp\\pool_accounts.csv"

- name: Upload ACL grant script to dc1
  ansible.windows.win_copy:
    src: grant_acls.ps1
    dest: "C:\\Windows\\Temp\\grant_acls.ps1"

- name: Grant the nine ACL rights to user1
  ansible.windows.win_shell: "C:\\Windows\\Temp\\grant_acls.ps1 -CsvPath 'C:\\Windows\\Temp\\pool_accounts.csv'"
  register: acl_result
  changed_when: "'Granted' in acl_result.stdout"

- name: Show ACL grant result
  ansible.builtin.debug:
    var: acl_result.stdout_lines

- name: Remove temp CSV and script from dc1
  ansible.windows.win_file:
    path: "{{ item }}"
    state: absent
  loop:
    - "C:\\Windows\\Temp\\pool_accounts.csv"
    - "C:\\Windows\\Temp\\grant_acls.ps1"
