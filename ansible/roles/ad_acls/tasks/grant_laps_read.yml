---
# Runs against dc2 -- needs the LAPS module for Set-LapsADReadPasswordPermission.
- name: Upload LAPS read-permission grant script to dc2
  ansible.windows.win_copy:
    src: grant_laps_read.ps1
    dest: "C:\\Windows\\Temp\\grant_laps_read.ps1"

- name: Grant user read access to sql2's LAPS password
  ansible.windows.win_shell: "C:\\Windows\\Temp\\grant_laps_read.ps1"
  environment:
    ADMIN_PASSWORD: "{{ vault_windows_admin_password }}"
  register: laps_read_result
  changed_when: "'Granted' in laps_read_result.stdout"

- name: Show LAPS read grant result
  ansible.builtin.debug:
    var: laps_read_result.stdout_lines

- name: Remove temp script from dc2
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\grant_laps_read.ps1"
    state: absent
