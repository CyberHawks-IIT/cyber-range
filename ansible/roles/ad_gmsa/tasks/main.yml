---
# Runs against dc2 (Server 2019 -- has the ActiveDirectory module). Creates the
# KDS root key (if absent) and the gmsa-backup$ gMSA, with 'user' allowed to
# retrieve its managed password. Local AD write on the DC, so no scheduled-task
# double-hop workaround is needed (confirmed New-ADServiceAccount works over a
# direct WinRM/NTLM session as it is a loopback directory write).
- name: Upload gMSA creation script to dc2
  ansible.windows.win_copy:
    src: create_gmsa.ps1
    dest: "C:\\Windows\\Temp\\create_gmsa.ps1"

- name: Create KDS root key (if needed) and the gmsa-backup gMSA
  ansible.windows.win_shell: "C:\\Windows\\Temp\\create_gmsa.ps1"
  register: gmsa_result
  changed_when: "'Created gMSA' in gmsa_result.stdout or 'Created backdated' in gmsa_result.stdout"

- name: Show gMSA creation result
  ansible.builtin.debug:
    var: gmsa_result.stdout_lines

- name: Remove gMSA creation script from dc2
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\create_gmsa.ps1"
    state: absent
