---
# Runs against web.
- name: Upload LSA secret scheduled task script
  ansible.windows.win_copy:
    src: setup_lsa_secret_task.ps1
    dest: "C:\\Windows\\Temp\\setup_lsa_secret_task.ps1"

- name: Create the scheduled task that caches svc-backup's password in LSA secrets
  ansible.windows.win_shell: "C:\\Windows\\Temp\\setup_lsa_secret_task.ps1"
  environment:
    SVC_BACKUP_PASSWORD: "{{ lookup('ansible.builtin.password', playbook_dir + '/../generated/svc_backup_password.txt', length=20) }}"
  register: lsa_result
  changed_when: "'Created' in lsa_result.stdout"

- name: Show LSA secret task result
  ansible.builtin.debug:
    var: lsa_result.stdout_lines

- name: Remove temp script
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\setup_lsa_secret_task.ps1"
    state: absent
