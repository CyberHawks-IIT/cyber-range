---
# Runs against dc1,dc2.
- name: Upload 1644 diagnostics configuration script
  ansible.windows.win_copy:
    src: configure_1644.ps1
    dest: "C:\\Windows\\Temp\\configure_1644.ps1"

- name: Apply 1644 LDAP diagnostics (Field Engineering, all thresholds at 1)
  ansible.windows.win_shell: "C:\\Windows\\Temp\\configure_1644.ps1"
  register: ldap_1644_result
  changed_when: true

- name: Show 1644 diagnostics result
  ansible.builtin.debug:
    var: ldap_1644_result.stdout_lines

- name: Remove temp script
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\configure_1644.ps1"
    state: absent
