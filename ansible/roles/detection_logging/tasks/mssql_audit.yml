---
# Runs against sql1 and sql2. Implements CLAUDE.md's "Monitoring rollout
# plan" step 2 ask for SQL Server telemetry: an Extended Events session
# (full statement text for xp_cmdshell/xp_dirtree/linked-server execution)
# plus a Server Audit Specification (EXECUTE AS impersonation), read back by
# a dedicated svc-sqlmonitor login -- see mssql_detection_audit.sql for the
# detail and reasoning.
- name: Upload SQL Server audit directory setup script
  ansible.windows.win_copy:
    src: create_sql_audit_dir.ps1
    dest: "C:\\Windows\\Temp\\create_sql_audit_dir.ps1"

- name: Create + grant svc-mssql access to the SQL Server audit output directory
  ansible.windows.win_shell: "C:\\Windows\\Temp\\create_sql_audit_dir.ps1"
  register: audit_dir_result
  changed_when: "'Created' in audit_dir_result.stdout or 'Granted' in audit_dir_result.stdout"

- name: Remove audit directory setup script
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\create_sql_audit_dir.ps1"
    state: absent

- name: Upload MSSQL detection-logging T-SQL script
  ansible.windows.win_copy:
    src: mssql_detection_audit.sql
    dest: "C:\\Windows\\Temp\\mssql_detection_audit.sql"

- name: Apply MSSQL detection-logging configuration (XE session + impersonation audit + monitoring login)
  ansible.windows.win_shell: >
    sqlcmd -S localhost -E
    -v MonitorPassword="{{ lookup('ansible.builtin.password', playbook_dir + '/../generated/svc_sqlmonitor_password.txt', length=20, chars=['ascii_letters', 'digits']) }}"
    -i C:\Windows\Temp\mssql_detection_audit.sql
  register: mssql_audit_result
  changed_when: true

- name: Show MSSQL detection-logging result
  ansible.builtin.debug:
    var: mssql_audit_result.stdout_lines

- name: Remove T-SQL script
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\mssql_detection_audit.sql"
    state: absent
