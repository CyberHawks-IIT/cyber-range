---
# Runs against ca. Implements CLAUDE.md's "Monitoring rollout plan" step 2
# ask for Certificate Services auditing -- see configure_adcs_audit.ps1 for
# detail and reasoning.
- name: Upload ADCS audit configuration script
  ansible.windows.win_copy:
    src: configure_adcs_audit.ps1
    dest: "C:\\Windows\\Temp\\configure_adcs_audit.ps1"

- name: Enable Certification Services auditing + AuditFilter
  ansible.windows.win_shell: "C:\\Windows\\Temp\\configure_adcs_audit.ps1"
  register: adcs_audit_result
  changed_when: "'Enabled Certification' in adcs_audit_result.stdout or 'Set CA' in adcs_audit_result.stdout"

- name: Show ADCS audit result
  ansible.builtin.debug:
    var: adcs_audit_result.stdout_lines

- name: Remove temp script
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\configure_adcs_audit.ps1"
    state: absent
