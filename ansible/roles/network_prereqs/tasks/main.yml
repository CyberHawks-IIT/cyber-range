---
# Not a named CLAUDE.md finding -- foundational plumbing the whole design
# depends on. Vanilla Windows Server ships with the "File and Printer
# Sharing" firewall rule group (SMB-In among others) disabled by default,
# which would silently block SMB access to every host in the range
# (the file share, LSASS/PsExec-style access, NTLM reflection, etc.) even
# once the intended misconfigurations are all correctly in place. Enabling
# it is not itself a vulnerability being introduced -- it's what makes the
# already-designed vulnerabilities actually reachable over the network.
- name: Enable File and Printer Sharing inbound firewall rules (enables SMB)
  ansible.windows.win_shell: >
    Set-NetFirewallRule -DisplayGroup "File and Printer Sharing" -Enabled True
  register: fw_result
  changed_when: true

# Same reasoning as the firewall fix above: Windows Defender's real-time
# protection is on by default and would silently block or flag a large
# fraction of this lab's intended findings (LSASS/credential dumping, the
# Phase J LSA-secrets finding, various tool execution) -- not a named
# finding itself, just what makes the designed ones reachable. Standard
# practice for intentionally-vulnerable training ranges.
- name: Disable Windows Defender real-time protection
  ansible.windows.win_shell: >
    Set-MpPreference -DisableRealtimeMonitoring $true
  register: defender_result
  changed_when: true
  failed_when: false

- name: Show Defender disable result (non-fatal if Defender isn't present/manageable)
  ansible.builtin.debug:
    msg: "{{ defender_result.stderr | default('') }}"
  when: defender_result.rc | default(0) != 0

# dc1 (PDC Emulator) had drifted ~2 hours from real time (likely from
# repeated snapshot/rollback cycles in this environment's history), which
# breaks Kerberos entirely (5-minute clock skew tolerance) for any client --
# including non-domain-joined attacker machines that correctly sync to real
# NTP. Fixed by pointing dc1 at real external NTP (so it agrees with any
# standard-NTP-synced external client) and raising the default phase
# correction limits (5 minutes) enough to actually apply a multi-hour
# correction instead of silently ignoring it. This is foundational and the
# range's VMs get paused/snapshotted often, so it's persisted here rather
# than left as a one-off manual fix.
#
# dc2 gets the identical external-NTP config, not just dc1 -- originally
# dc2 was left on the domain-hierarchy default (NT5DS, syncing from dc1),
# which is the textbook-correct setup for a non-PDC-emulator DC. In
# practice this range's DCs get fully powered off and cold-booted together
# (snapshots, rollbacks) far more often than a real domain ever would, and
# NT5DS has a chicken-and-egg problem on a cold boot: it needs a
# Kerberos-authenticated call to another DC to get the time, but Kerberos
# itself won't work until the clock is already within 5 minutes of correct.
# Confirmed live, twice (once after a `qm rollback`, once after this
# session's own ordinary snapshot power-cycle): dc2 comes up stuck on
# "Local CMOS Clock", drifts ~2 hours out from dc1, and replication for
# several NCs fails with Kerberos error 1908 until someone manually forces
# a resync. Pointing both DCs at the same external NTP pool sidesteps that
# bootstrap race entirely -- they converge to the same real time
# independently of each other and of Kerberos being up yet. Not the
# Microsoft-recommended production topology (only the PDC emulator should
# normally go external), but this environment is a training lab prioritizing
# "comes back up correctly after every cold boot" over hierarchy purity.
- name: Configure dc1 and dc2 for real external NTP sync (avoids the NT5DS cold-boot chicken-and-egg problem)
  ansible.windows.win_shell: >
    w32tm /config /manualpeerlist:"time.windows.com,0x8 time.google.com,0x8 pool.ntp.org,0x8" /syncfromflags:manual /reliable:yes /update
  when: inventory_hostname in ['dc1', 'dc2']
  changed_when: true

- name: Raise w32time max phase correction limits on dc1/dc2 (default 5 min is too small for a multi-hour drift recovery)
  ansible.windows.win_shell: >
    Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Config" -Name "MaxPosPhaseCorrection" -Value 0x7FFFFFFF -Type DWord;
    Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Config" -Name "MaxNegPhaseCorrection" -Value 0x7FFFFFFF -Type DWord
  when: inventory_hostname in ['dc1', 'dc2']
  changed_when: true

- name: Restart w32time and force resync on dc1/dc2
  ansible.windows.win_shell: "Restart-Service w32time -Force; Start-Sleep -Seconds 3; w32tm /resync /force"
  when: inventory_hostname in ['dc1', 'dc2']
  changed_when: true
  failed_when: false

- name: Restart w32time and resync all other domain members from the hierarchy
  ansible.windows.win_shell: "Restart-Service w32time -Force; Start-Sleep -Seconds 3; w32tm /resync /rediscover"
  when: inventory_hostname not in ['dc1', 'dc2']
  changed_when: true
  failed_when: false

# Belt-and-suspenders on top of the external-NTP config above: w32time's own
# startup poll cycle *should* self-correct within its first minute or two on
# every future boot without any of this, but a scheduled task removes the
# wait entirely and makes the fix self-healing with no dependency on service
# startup ordering or poll-interval timing being cooperative. Idempotent --
# recreating an identical task on every playbook run is harmless.
# A file-backed script (not an inline -Command) avoids a nested-quoting
# failure in the /TR argument -- confirmed live: schtasks' own command-line
# parser mangled the escaped inner quotes needed for -Command.
#
# Member servers (web/ca/sql1/sql2/workstation) get this too, not just the
# DCs -- 2026-09-29. The member servers sync from the domain hierarchy
# (NT5DS), which has the SAME cold-boot chicken-and-egg as dc2 did: the
# secure-channel/Kerberos call to a DC for the time won't succeed until the
# member's own clock is already within tolerance, so a member that cold-boots
# skewed (which happens after every snapshot restore) stays skewed until
# w32time's own slow poll eventually catches up. That window is long enough
# that services which cache the wall clock at startup latch the WRONG time --
# confirmed live on `web`: HTTP.SYS (kernel-mode IIS logging) latched a
# ~1h-ahead boot-time clock and kept stamping every request with it even
# after w32tm had corrected the OS clock and an iisreset recycled w3wp (only
# a reboot with a correct clock clears the HTTP.SYS time cache). Future-dated
# IIS log lines then fall outside every scheduled detection's `latest=now`
# window -- the ESC8 / Web.config.bak detections would silently never fire.
# The boot task force-resyncs early so the clock is correct before those
# caches latch. Members use /rediscover (re-find the domain time peer) and a
# longer 60s delay so the DCs are up and the secure channel is available;
# the DCs keep /force against their external NTP peers.
- name: Upload the startup resync script (dc1/dc2 -- external NTP, /force)
  ansible.windows.win_copy:
    content: |
      Start-Sleep -Seconds 30
      w32tm /resync /force
    dest: "C:\\Windows\\Temp\\force_time_resync.ps1"
  when: inventory_hostname in ['dc1', 'dc2']

- name: Upload the startup resync script (member servers -- NT5DS, /rediscover after DCs are up)
  ansible.windows.win_copy:
    content: |
      Start-Sleep -Seconds 60
      w32tm /resync /rediscover /force
    dest: "C:\\Windows\\Temp\\force_time_resync.ps1"
  when: inventory_hostname not in ['dc1', 'dc2']

- name: Create a startup task that force-resyncs w32time on every Windows host
  ansible.windows.win_shell: >
    schtasks /Create /TN "ForceTimeResyncOnBoot" /TR "powershell.exe -ExecutionPolicy Bypass -File C:\Windows\Temp\force_time_resync.ps1" /SC ONSTART /RU "SYSTEM" /RL HIGHEST /F
  changed_when: true
