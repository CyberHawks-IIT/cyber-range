---
# Not a named CLAUDE.md finding -- foundational plumbing the whole design
# depends on. Vanilla Windows Server ships with the "File and Printer
# Sharing" firewall rule group (SMB-In among others) disabled by default,
# which would silently block SMB access to every host in the range
# (the file share, LSASS/PsExec-style access, NTLM reflection, etc.) even
# once the intended misconfigurations are all correctly in place. Enabling
# it is not itself a vulnerability being introduced -- it's what makes the
# already-designed vulnerabilities actually reachable over the network.
- name: Enable File and Printer Sharing inbound firewall rules (enables SMB)
  ansible.windows.win_shell: >
    Set-NetFirewallRule -DisplayGroup "File and Printer Sharing" -Enabled True
  register: fw_result
  changed_when: true

# Same reasoning as the firewall fix above: Windows Defender's real-time
# protection is on by default and would silently block or flag a large
# fraction of this lab's intended findings (LSASS/credential dumping, the
# Phase J LSA-secrets finding, various tool execution) -- not a named
# finding itself, just what makes the designed ones reachable. Standard
# practice for intentionally-vulnerable training ranges.
- name: Disable Windows Defender real-time protection
  ansible.windows.win_shell: >
    Set-MpPreference -DisableRealtimeMonitoring $true
  register: defender_result
  changed_when: true
  failed_when: false

- name: Show Defender disable result (non-fatal if Defender isn't present/manageable)
  ansible.builtin.debug:
    msg: "{{ defender_result.stderr | default('') }}"
  when: defender_result.rc | default(0) != 0

# dc1 (PDC Emulator) had drifted ~2 hours from real time (likely from
# repeated snapshot/rollback cycles in this environment's history), which
# breaks Kerberos entirely (5-minute clock skew tolerance) for any client --
# including non-domain-joined attacker machines that correctly sync to real
# NTP. Fixed by pointing dc1 at real external NTP (so it agrees with any
# standard-NTP-synced external client) and raising the default phase
# correction limits (5 minutes) enough to actually apply a multi-hour
# correction instead of silently ignoring it. This is foundational and the
# range's VMs get paused/snapshotted often, so it's persisted here rather
# than left as a one-off manual fix.
- name: Configure dc1 for real external NTP sync (PDC Emulator is the domain's time authority)
  ansible.windows.win_shell: >
    w32tm /config /manualpeerlist:"time.windows.com,0x8 time.google.com,0x8 pool.ntp.org,0x8" /syncfromflags:manual /reliable:yes /update
  when: inventory_hostname == 'dc1'
  changed_when: true

- name: Raise w32time max phase correction limits on dc1 (default 5 min is too small for a multi-hour drift recovery)
  ansible.windows.win_shell: >
    Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Config" -Name "MaxPosPhaseCorrection" -Value 0x7FFFFFFF -Type DWord;
    Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Config" -Name "MaxNegPhaseCorrection" -Value 0x7FFFFFFF -Type DWord
  when: inventory_hostname == 'dc1'
  changed_when: true

- name: Restart w32time and force resync on dc1
  ansible.windows.win_shell: "Restart-Service w32time -Force; Start-Sleep -Seconds 3; w32tm /resync /force"
  when: inventory_hostname == 'dc1'
  changed_when: true
  failed_when: false

- name: Restart w32time and resync all other domain members from the hierarchy
  ansible.windows.win_shell: "Restart-Service w32time -Force; Start-Sleep -Seconds 3; w32tm /resync /rediscover"
  when: inventory_hostname != 'dc1'
  changed_when: true
  failed_when: false
