---
# Runs against workstation.
- name: Upload coercion setup script
  ansible.windows.win_copy:
    src: setup_coercion.ps1
    dest: "C:\\Windows\\Temp\\setup_coercion.ps1"

- name: Apply workstation coercion setup (WebClient auto-start, NTLM reflection weakening)
  ansible.windows.win_shell: "C:\\Windows\\Temp\\setup_coercion.ps1"
  register: coercion_result
  changed_when: true

- name: Show coercion setup result
  ansible.builtin.debug:
    var: coercion_result.stdout_lines

- name: Remove temp script
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\setup_coercion.ps1"
    state: absent
