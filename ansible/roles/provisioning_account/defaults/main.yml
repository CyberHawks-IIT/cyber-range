---
# The dedicated local automation account this repo's playbooks connect as.
#
# Why a separate account instead of the built-in Administrator: two of the
# range hosts (ca, sql2) put the *built-in* local Administrator under LAPS
# management (see the `laps` role / Phase C), so its password rotates on a
# schedule and can't be used for unattended automation. A purpose-made local
# admin that LAPS does not manage sidesteps that entirely and works
# identically on every host, LAPS or not -- so all three playbooks
# (base-domain, vulnerable-range, and the monitoring Phase Q) connect as this
# account rather than special-casing ca/sql2 onto the domain Administrator.
#
# It is a local Administrators member on each host (never a domain account),
# so it keeps working even if the domain/DCs are down, and it is created
# BEFORE the domain exists (first step of base-domain.yml). It is ops
# infrastructure, not one of the range's intended findings -- same category
# as svc-sqlmonitor.
provisioning_account_name: svc-provision
