---
# Runs against dc1.
- name: Upload ESC template build script
  ansible.windows.win_copy:
    src: build_esc_templates.ps1
    dest: "C:\\Windows\\Temp\\build_esc_templates.ps1"

- name: Build the 8 genuine ESC templates (ESC1,2,3,4,9,13,15,17)
  ansible.windows.win_shell: "C:\\Windows\\Temp\\build_esc_templates.ps1"
  register: templates_result
  changed_when: "'Created' in templates_result.stdout"

- name: Show template build result
  ansible.builtin.debug:
    var: templates_result.stdout_lines

- name: Extract Domain Users SID for cross-host use (ca can't reliably query AD)
  ansible.builtin.set_fact:
    domain_users_sid: "{{ templates_result.stdout | regex_search('DOMAIN_USERS_SID=(\\S+)', '\\1') | first }}"

- name: Remove temp script from dc1
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\build_esc_templates.ps1"
    state: absent
